@if (!isLoggedIn) {
<div class="login-container">
  <div class="login-card">
    <h1>Iniciar Sesión</h1>

    <input type="email" [(ngModel)]="email" placeholder="Correo">
    <input type="password" [(ngModel)]="password" placeholder="Contraseña">

    <button (click)="login()">Ingresar</button>

    <p>{{ respuesta }}</p>
  </div>
</div>
}

@if (isLoggedIn) {
<div class="dashboard-container">

  <div class="dashboard-header">
    <div>
      <h1>Bienvenido, {{ nombre }}</h1>
      <p>Rol: {{ rol }}</p>
    </div>

    <button class="logout-btn" (click)="logout()">
      Cerrar sesión
    </button>
  </div>

  <div class="dashboard-card">
    <h2>Gestión de Usuarios</h2>

    <div class="form-grid">
      <input [(ngModel)]="name" placeholder="Nombre">
      <input [(ngModel)]="userEmail" placeholder="Email">
      <input [(ngModel)]="userPassword" placeholder="Password">
      <input [(ngModel)]="role" placeholder="Rol">
    </div>

    <div class="button-group">
      <button class="create-btn" (click)="createUser()">Crear</button>
      <button class="update-btn" (click)="updateUser()">Actualizar</button>
    </div>
  </div>

  <div class="dashboard-card">
    <h2>Lista de Usuarios</h2>

    <ul class="user-list">
      @for (user of users; track user._id) {
        <li>
          <div>
            <strong>{{ user.name }}</strong>
            <span>{{ user.role }}</span>
          </div>

          <div>
            <button class="edit-btn" (click)="editUser(user)">Editar</button>
            <button class="delete-btn" (click)="deleteUser(user._id)">Eliminar</button>
          </div>
        </li>
      }
    </ul>
  </div>

</div>
}
